<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiraiPlayer · README</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0; width: 1600px; height: 800px; overflow: hidden; background: #f9f9f8; color: #17171a; font-family: "Segoe UI", "Microsoft YaHei", sans-serif }
  main { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 87% 65%, #e0dfed 0%, transparent 47%) }
  header { position: absolute; top: 120px; left: 64px; width: 504px }
  header .logo { display: block; width: 100px; height: 100px; margin-bottom: 22px }
  h1 { margin: 0 0 35px; font-size: 78px; font-weight: 720; line-height: 1.12; letter-spacing: -4px }
  h2 { margin: 0 0 17px; font-size: 42px; line-height: 1.2; font-weight: 620; letter-spacing: -2px }
  p { margin: 0; color: #61616a; font-size: 24px; line-height: 1.6 }
  small { display: block; margin-top: 34px; font-size: 17px; font-weight: 600; color: #656572; letter-spacing: .03em }
  .back, .front { display: block; position: absolute; object-fit: cover; border-radius: 16px; border: 1px solid #27262d; box-shadow: 0 18px 50px #211c392b, 0 3px 12px #16131825 }
  .back { top: 81px; left: 565px; width: 852px }
  .front { top: 215px; left: 667px; width: 887px }
</style>
<main>
  <header>
    <img class="logo" src="miraiplayer-logo.png" alt="">
    <h1>Mirai Player</h1>
    <h2>桌面音乐播放器</h2>
    <p>在线歌单、逐字歌词<br>与玻璃播放小窗</p>
    <small>Windows · macOS · Linux</small>
  </header>
  <img class="back" src="feature-home.png" alt="">
  <img class="front" src="feature-fashion.png" alt="">
</main>
<script>
  if (new URLSearchParams(location.search).get('lang') === 'en') {
    document.documentElement.lang = 'en'
    document.querySelector('h2').textContent = 'Desktop music player'
    document.querySelector('p').innerHTML = 'Online playlists, word-synced lyrics<br>and floating playback controls'
  }
</script>
</html>
