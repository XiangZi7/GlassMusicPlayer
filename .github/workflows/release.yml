name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已推送的版本标签（填写后发布该版本）；留空只构建开发包'
        required: false
        type: string
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows_x64, runner: windows-2025 }
          - { platform: macos_x64, runner: macos-15-intel }
          - { platform: macos_arm64, runner: macos-15 }
          - { platform: linux_x64, runner: ubuntu-22.04 }
    env:
      RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - run: node scripts/check-release.mjs
      - run: node --test tests/release*.test.mjs
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/app-updater.test.mjs
      - name: Install Linux desktop and media libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file curl wget libwebkit2gtk-4.1-dev libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev libfuse2 patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools
      - name: Set Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup override set 1.96.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}
      - run: pnpm check:equalizer
      - run: pnpm check:motion
      - run: pnpm check:desktop
      - run: pnpm check:native
      - run: pnpm check:storage
      - name: Build desktop packages
        shell: bash
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ env.RELEASE_TAG != '' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.RELEASE_TAG != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.RELEASE_TAG != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -eo pipefail
          if [[ "$RUNNER_OS" != macOS ]]; then
            pnpm release:build
            exit 0
          fi
          log="$RUNNER_TEMP/mirai-dmg-build.log"
          if pnpm release:build 2>&1 | tee "$log"; then
            exit 0
          else
            status=$?
          fi
          grep -Eq "hdiutil: couldn't eject .*Resource busy" "$log" || exit "$status"
          echo "::warning::磁盘映像暂时被占用，15 秒后重试生成 DMG。"
          sleep 15
          node scripts/release-build.mjs --bundle-only
          node scripts/package-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MiraiPlayer-${{ matrix.platform }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.2'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: MiraiPlayer-*
          path: release-input
      - name: Verify packages, upload assets and publish
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          node scripts/assemble-release.mjs "$TAG" "$commit" release-input release-output
          (cd release-output && sha256sum --check --strict SHA256SUMS.txt)
          if [[ -f release-output/latest.json ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y minisign
            printf '%s' "$TAURI_UPDATER_PUBLIC_KEY" | base64 --decode > "$RUNNER_TEMP/updater.pub"
            for sig in release-output/*.sig; do
              base64 --decode "$sig" > "$RUNNER_TEMP/updater.minisig"
              node scripts/verify-update-signature.mjs "$TAG" "$RUNNER_TEMP/updater.pub" "$RUNNER_TEMP/updater.minisig" "${sig%.sig}"
            done
          fi
          object=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object')
          while [[ $(jq -r '.type' <<< "$object") == tag ]]; do
            tag_sha=$(jq -r '.sha' <<< "$object")
            object=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object')
          done
          [[ $(jq -r '.type' <<< "$object") == commit && $(jq -r '.sha' <<< "$object") == "$commit" ]]
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" \
            | jq 'add // [] | map({tag_name, draft, prerelease})' > "$RUNNER_TEMP/releases.json"
          notes="$RUNNER_TEMP/release-notes.md"
          node scripts/release-notes.mjs "$TAG" "$GH_REPO" "$notes" "$RUNNER_TEMP/releases.json"
          preview=$(jq -r '.prerelease' release-output/version.json)
          if draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft'); then
            [[ "$draft" == true ]] || { echo '该标签已有公开版本。'; exit 1; }
          else
            gh release create "$TAG" --draft --verify-tag --title "MiraiPlayer $TAG" --prerelease="$preview" --notes-file "$notes"
          fi
          gh release upload "$TAG" release-output/* --clobber
          gh release edit "$TAG" --draft=false --prerelease="$preview" --notes-file "$notes"
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
